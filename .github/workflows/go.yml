# This workflow will build a golang project!
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Start Database
        run: docker compose up -d postgres

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          args: controllers/ database/ models/ routes/

      - name: Verificar variáveis
        run: |
          echo "TEST=${{ secrets.TEST }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env

      - name: Mostrar conteúdo do .env
        run: cat .env

      - name: Ver caminho e conteúdo do .env
        run: |
          echo "Caminho absoluto do .env:"
          realpath .env
        
      - name: Test
        run: DB_HOST=${{ secrets.DB_HOST }} DB_USER=${{ secrets.DB_USER }} DB_PASSWORD=${{ secrets.DB_PASSWORD }} DB_NAME=${{ secrets.DB_NAME }} DB_PORT=${{ secrets.DB_PORT }} go test -v main_test.go

      - name: Build
        run: go build main.go

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projeto_compilado
          path: main
